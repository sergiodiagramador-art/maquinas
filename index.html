<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOSRIM — Protótipo</title>

<style>
:root{
--blue:#073b75;
--blue2:#0b5cad;
--green:#16a05d;
--yellow:#e6a900;
--red:#d92d3b;
--bg:#f4f7fb;
--card:#fff;
--text:#172235;
--muted:#64748b;
--line:#e5eaf1;
--shadow:0 8px 28px #113a6812
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
font:15px system-ui,-apple-system,Segoe UI,sans-serif;
color:var(--text)
}

button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}

.top{
background:linear-gradient(135deg,#062b59,#0c68bb);
color:#fff;
padding:18px 18px 14px;
position:sticky;
top:0;
z-index:5;
box-shadow:0 4px 20px #073b7540
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.ambulance{font-size:38px}

.brand h1{
margin:0;
font-size:25px;
letter-spacing:2px
}

.brand small{opacity:.8}

.user{
margin-left:auto;
display:flex;
align-items:center;
gap:8px;
font-size:13px
}

.logout{
background:#ffffff22;
color:#fff;
border:1px solid #ffffff55;
padding:7px 10px;
border-radius:9px
}

.tabs{
display:flex;
gap:6px;
overflow:auto;
margin-top:18px
}

.tabs button{
white-space:nowrap;
background:#ffffff18;
color:#dcecff;
padding:10px 13px;
border-radius:10px
}

.tabs button.active{
background:#fff;
color:var(--blue);
font-weight:700
}

.content{padding:18px}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:5px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:15px;
box-shadow:var(--shadow)
}

.machine{
position:relative;
min-height:56px;
border-left:5px solid var(--green);
transition:.2s;
padding:6px 7px;
display:flex;
align-items:center;
background:#fff;
border-radius:8px
}

.machine.yellow{border-color:var(--yellow)}

.machine.red{
border-color:var(--red);
animation:pulse 2s ease-in-out infinite
}

.machine.overdue{
box-shadow:0 0 0 3px #d92d3b22;
animation:overdue 1.8s ease-in-out infinite
}

@keyframes overdue{
50%{
background:#fff2f3;
box-shadow:0 0 0 6px #d92d3b22
}
}

.overdue-mark{
color:var(--red);
font-size:10px;
font-weight:800;
margin-left:3px
}

@keyframes pulse{
50%{
box-shadow:0 0 0 5px #d92d3b18,0 8px 28px #113a6812
}
}

.machine-top{
display:flex;
align-items:center;
gap:3px;
min-width:0;
flex:1
}

.machine-top>div{min-width:0}

.num{
order:3;
width:25px;
height:25px;
flex:0 0 25px;
border-radius:6px;
background:var(--green);
color:#fff;
display:grid;
place-items:center;
font-size:12px;
font-weight:800;
margin-left:3px
}

.yellow .num{background:var(--yellow)}
.red .num{background:var(--red)}

.machine h3{
margin:0;
font-size:16px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.machine small{
color:var(--muted);
font-size:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
display:block
}

.status{display:none}

.meta{
font-size:9px;
color:var(--muted);
margin-top:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.btn{
padding:9px 12px;
border-radius:10px;
background:#eaf2fb;
color:var(--blue);
font-weight:700
}

.btn.primary{
background:var(--blue2);
color:white
}

.btn.danger{
background:#fff0f1;
color:var(--red)
}

.toolbar{
display:flex;
gap:8px;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
flex-wrap:wrap
}

.toolbar h2{margin:0}

.form{
display:flex;
gap:8px;
flex-wrap:wrap
}

.form input,
.form select,
.form textarea{
border:1px solid var(--line);
border-radius:10px;
padding:10px;
background:#fff
}

.list{
display:grid;
gap:9px
}

.item{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:12px;
border-bottom:1px solid var(--line)
}

.item:last-child{border:0}

.muted{color:var(--muted)}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:14px
}

.stat b{
display:block;
font-size:25px
}

.login{
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
background:linear-gradient(145deg,#062b59,#1381d0)
}

.loginbox{
max-width:420px;
width:100%;
background:#fff;
border-radius:24px;
padding:28px;
box-shadow:0 20px 60px #001a3c55
}

.loginbox h1{
color:var(--blue);
margin:5px 0
}

.driver{
display:block;
width:100%;
padding:14px;
margin-top:10px;
text-align:left;
border-radius:12px;
background:#edf5fd;
color:var(--blue);
font-weight:700
}

.driver:hover{background:#d9ebff}

.notice{
padding:10px;
border-radius:10px;
background:#fff8dc;
color:#795900;
font-size:13px;
margin-bottom:12px
}

.empty{
padding:35px;
text-align:center;
color:var(--muted)
}

@media(max-width:800px){
.grid{
grid-template-columns:repeat(3,minmax(0,1fr))
}
}

@media(max-width:520px){
.content{padding:5px}

.grid{
