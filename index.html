<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOSRIM — Protótipo</title>
<style>
:root{--blue:#073b75;--blue2:#0b5cad;--green:#16a05d;--yellow:#e6a900;--red:#d92d3b;--bg:#f4f7fb;--card:#fff;--text:#172235;--muted:#64748b;--line:#e5eaf1;--shadow:0 8px 28px #113a6812}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:1180px;margin:auto;padding-bottom:30px}.top{background:linear-gradient(135deg,#062b59,#0c68bb);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #073b7540}.brand{display:flex;align-items:center;gap:12px}.ambulance{font-size:38px}.brand h1{margin:0;font-size:25px;letter-spacing:2px}.brand small{opacity:.8}.user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}.logout{background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:7px 10px;border-radius:9px}.tabs{display:flex;gap:6px;overflow:auto;margin-top:18px}.tabs button{white-space:nowrap;background:#ffffff18;color:#dcecff;padding:10px 13px;border-radius:10px}.tabs button.active{background:#fff;color:var(--blue);font-weight:700}.content{padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow)}.machine{position:relative;min-height:56px;border-left:5px solid var(--green);transition:.2s;padding:6px 7px;display:flex;align-items:center;background:#fff;border-radius:8px}.machine.yellow{border-color:var(--yellow)}.machine.red{border-color:var(--red);animation:pulse 2s ease-in-out infinite}.machine.overdue{box-shadow:0 0 0 3px #d92d3b22;animation:overdue 1.8s ease-in-out infinite}@keyframes overdue{50%{background:#fff2f3;box-shadow:0 0 0 6px #d92d3b22}}.overdue-mark{color:var(--red);font-size:10px;font-weight:800;margin-left:3px}@keyframes pulse{50%{box-shadow:0 0 0 5px #d92d3b18,0 8px 28px #113a6812}}.machine-top{display:flex;align-items:center;gap:3px;min-width:0;flex:1}.machine-top>div{min-width:0}.num{order:3;width:25px;height:25px;flex:0 0 25px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;margin-left:3px}.yellow .num{background:var(--yellow)}.red .num{background:var(--red)}.machine h3{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine small{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.status{display:none}.yellow .status{background:var(--yellow)}.red .status{background:var(--red)}.meta{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine .btn{padding:4px 5px;border-radius:6px;font-size:9px;margin-left:3px}.btn{padding:9px 12px;border-radius:10px;background:#eaf2fb;color:var(--blue);font-weight:700}.btn.primary{background:var(--blue2);color:white}.btn.danger{background:#fff0f1;color:var(--red)}.btn+button{margin-left:6px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.toolbar h2{margin:0}.form{display:flex;gap:8px;flex-wrap:wrap}.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.form textarea{min-width:230px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat b{display:block;font-size:25px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#062b59,#1381d0)}.loginbox{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 60px #001a3c55}.loginbox h1{color:var(--blue);margin:5px 0}.driver{display:block;width:100%;padding:14px;margin-top:10px;text-align:left;border-radius:12px;background:#edf5fd;color:var(--blue);font-weight:700}.driver:hover{background:#d9ebff}.notice{padding:10px;border-radius:10px;background:#fff8dc;color:#795900;font-size:13px;margin-bottom:12px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.content{padding:5px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.machine{min-height:56px;padding:5px 6px}.user small{display:none}.tabs button{padding:9px 10px}}
</style>
</head>
<body><div id="root"></div>
<script>
let initializeApp,getDatabase,ref,onValue,push,set,update,remove;

const firebaseConfig={apiKey:'COLE_SUA_API_KEY',authDomain:'SEU_PROJETO.firebaseapp.com',databaseURL:'https://SEU_PROJETO-default-rtdb.firebaseio.com',projectId:'SEU_PROJETO',storageBucket:'SEU_PROJETO.appspot.com',messagingSenderId:'',appId:''};
const HOSP=['Erasto','Erastinho','Marcelino','Nações','Oswaldo','Fraturas','Pilar','S. Lucas','Graças','N. Saúde','IIC','Trabalhador','Marillac','P. Francisco','Yoshimi','Alberto','Gerson','Monastier'];
const DRIVERS=['Sergio','Aderildo','Jairo']; const BASE={name:'Base SOSRIM',address:'Rua Buenos Aires, 792',lat:null,lng:null};
let db=null,remote=false,tab=1,driver=localStorage.sos_driver||'',data={machines:Array.from({length:18},(_,i)=>({id:i+1,number:i+1,status:'base',hospital:'',releasedAt:''})),hospitals:HOSP.map((name,i)=>({id:'h'+i,name,lat:null,lng:null})),materials:[],history:[]};
function connectFirebase(){}
const now=()=>new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}); const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function save(){localStorage.sosrim=JSON.stringify(data);if(remote) await set(ref(db,'sosrim'),data)}
function log(action,detail){data.history.unshift({at:now(),driver,action,detail});save()}
function login(name){driver=name;localStorage.sos_driver=name;render()}; function logout(){driver='';localStorage.removeItem('sos_driver');render()}
async function setStatus(id){let m=data.machines.find(x=>x.id==id),next=m.status==='base'?'street':m.status==='street'?'collect':'base';if(next==='base'){m.status='base';m.releasedAt='';m.leaveAt='';m.collectAt='';log('Máquina '+m.number,'retornou à base (sem horário)')}else{let label=next==='street'?'Horário em que deixou a máquina':'Horário em que recolheu a máquina';let value=await pickTime(label);if(value===null)return;m.status=next;if(next==='street'){m.leaveAt=value;m.releasedAt=value}else m.collectAt=value;log('Máquina '+m.number,next==='street'?'deixada na rua às '+value:'recolhida às '+value)}save();render()}
function pickTime(label){return new Promise(resolve=>{let d=document.createElement('div');d.style='position:fixed;inset:0;background:#001a3c66;display:grid;place-items:center;z-index:20;padding:20px';let t=new Date().toTimeString().slice(0,5);d.innerHTML=`<div style="background:white;border-radius:20px;padding:22px;width:min(330px,100%);box-shadow:0 20px 60px #001a3c55"><h3 style="margin:0 0 6px;color:#073b75">${label}</h3><p style="margin:0 0 14px;color:#64748b;font-size:13px">Escolha o horário da atividade</p><input id="sosTime" type="time" value="${t}" style="width:100%;font-size:30px;padding:12px;border:2px solid #0b5cad;border-radius:14px;color:#073b75;text-align:center"><div style="display:flex;gap:8px;margin-top:14px"><button id="cancelTime" class="btn" style="flex:1">Cancelar</button><button id="okTime" class="btn primary" style="flex:1">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('#sosTime').focus();d.querySelector('#okTime').onclick=()=>{let v=d.querySelector('#sosTime').value||t;d.remove();resolve(v)};d.querySelector('#cancelTime').onclick=()=>{d.remove();resolve(null)}})}
function goTab(n){tab=n;render()}
function overdue(m){if(m.status!=='collect'||!m.collectAt)return false;let p=m.collectAt.split(':').map(Number),d=new Date();d.setHours(p[0],p[1],0,0);return Date.now()>d.getTime()}
function machineForm(){return data.machines.map(m=>{let t=m.status==='street'?m.leaveAt:m.status==='collect'?m.collectAt:'';let late=overdue(m);return `<div class="card machine ${m.status==='street'?'yellow':m.status==='collect'?'red':''} ${late?'overdue':''}" onclick="setStatus(${m.id})" title="Toque no botão para alterar situação"><div class="machine-top"><div onclick="event.stopPropagation();changeHospital(${m.id})" style="min-width:0;flex:1"><h3>${esc(m.hospital||'Escolher hospital')}</h3><small>${m.status==='base'?'BASE':m.status==='street'?'RUA':'RECOLHER'} ${t?'· '+esc(t):''}${late?' · ATRASADA':''}</small></div><button class="num" onclick="event.stopPropagation();changeNumber(${m.id})">${esc(m.number)}</button></div>${late?'<span class="overdue-mark">⏰</span>':''}</div>`}).join('')}
function machines(){let n=data.machines.filter(m=>m.status==='base').length;return `<div class="toolbar"><div><h2>Controle das máquinas</h2><span class="muted">Toque no hospital para escolher. Toque no botão para alterar.</span></div><div class="stats"><div class="card"><b>${n}</b><span class="muted">na base</span></div><div class="card"><b>${data.machines.filter(m=>m.status==='street').length}</b><span class="muted">na rua</span></div></div></div><div class="grid">${machineForm()}</div>`}
function routes(){return `<div class="toolbar"><h2>Rotas e materiais</h2><button class="btn primary" onclick="navigator.geolocation && navigator.geolocation.getCurrentPosition(p=>alert('GPS capturado: '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)),()=>alert('Não foi possível obter o GPS'))">📍 Capturar base</button></div><div class="card"><h3>Máquinas liberadas</h3><p class="muted">Rotas até 30 minutos após o horário atual. O Google Maps/Waze será integrado após cadastrar os pins.</p>${data.machines.filter(m=>m.status!=='base').map(m=>`<div class="item"><span><b>Máquina ${m.number}</b> · ${esc(m.hospital||'hospital não informado')}<br><small>${m.releasedAt||'sem horário'}</small></span><span><button class="btn" onclick="openMaps('${encodeURIComponent(m.hospital||'hospital')}')">Maps</button><button class="btn" onclick="openWaze('${encodeURIComponent(m.hospital||'hospital')}')">Waze</button></span></div>`).join('')||'<div class="empty">Nenhuma máquina liberada.</div>'}</div><div class="card" style="margin-top:12px"><h3>Materiais diversos</h3><form class="form" onsubmit="addMaterial(event)"><input name="material" placeholder="Material" required><input name="hospital" placeholder="Hospital" required><input name="obs" placeholder="Observação"><button class="btn primary">Cadastrar material</button></form><div class="list">${data.materials.map(x=>`<div class="item">${esc(x.material)} · ${esc(x.hospital)} <small>${esc(x.at)}</small></div>`).join('')}</div></div>`}
function hospitals(){return `<div class="toolbar"><h2>Hospitais e localização</h2><form class="form" onsubmit="addHospital(event)"><input name="name" placeholder="Nome curto" required><input name="lat" type="number" step="any" placeholder="latitude"><input name="lng" type="number" step="any" placeholder="longitude"><button class="btn primary">Adicionar</button></form></div><div class="card list">${data.hospitals.map(h=>`<div class="item"><span><b>${esc(h.name)}</b><br><small class="muted">${h.lat&&h.lng?h.lat+', '+h.lng:'sem pin'}</small></span><button class="btn danger" onclick="delHospital('${h.id}')">Excluir</button></div>`).join('')}</div>`}
function fleet(){return `<div class="toolbar"><h2>Lista de máquinas</h2><button class="btn primary" onclick="addMachine()">+ Adicionar máquina</button></div><div class="card list">${data.machines.map(m=>`<div class="item"><span><b>Máquina ${m.number}</b> · ${m.status}</span><button class="btn danger" onclick="delMachine(${m.id})">Excluir</button></div>`).join('')}</div>`}
function closing(){return `<div class="toolbar"><h2>Fechamento e histórico</h2><span class="muted">Motorista: ${esc(driver)}</span></div><div class="card"><button class="btn primary" onclick="downloadTxt()">⬇ Gerar TXT</button> <button class="btn" onclick="window.print()">🖨 Gerar PDF</button> <button class="btn" onclick="backup()">💾 Salvar backup</button></div><div class="card" style="margin-top:12px"><h3>Todas as atividades</h3>${data.history.map(x=>`<div class="item"><span><b>${esc(x.action)}</b><br>${esc(x.detail)}</span><small class="muted">${esc(x.at)} · ${esc(x.driver)}</small></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div>`}
window.login=login;window.logout=logout;window.setStatus=setStatus;window.goTab=goTab;window.tab=tab;window.openMaps=q=>window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank');window.openWaze=q=>window.open('https://www.waze.com/ul?q='+q,'_blank');
window.changeHospital=id=>{let m=data.machines.find(x=>x.id==id),list=data.hospitals.map((h,i)=>(i+1)+'. '+h.name).join('\n');let answer=prompt('Digite o número do hospital:\n\n'+list,m.hospital?data.hospitals.findIndex(h=>h.name===m.hospital)+1:'');if(answer===null)return;let h=data.hospitals[Number(answer)-1];if(h){m.hospital=h.name;log('Hospital definido','Máquina '+m.number+' · '+h.name);save();render()}};
window.changeNumber=async id=>{let m=data.machines.find(x=>x.id==id),n=prompt('Nova numeração da máquina:',m.number);if(n&&Number(n)>0){m.number=Number(n);log('Numeração alterada','Máquina '+id+' agora é '+n);render()}};
window.addMachine=()=>{let id=Date.now();data.machines.push({id,number:Math.max(...data.machines.map(m=>m.number))+1,status:'base',hospital:'',releasedAt:''});log('Máquina adicionada','Máquina '+data.machines[data.machines.length-1].number);render()};window.delMachine=id=>{if(confirm('Excluir esta máquina?')){data.machines=data.machines.filter(m=>m.id!=id);log('Máquina excluída','ID '+id);render()}};
window.addHospital=e=>{e.preventDefault();let f=new FormData(e.target);data.hospitals.push({id:'h'+Date.now(),name:f.get('name'),lat:f.get('lat')||null,lng:f.get('lng')||null});log('Hospital cadastrado',f.get('name'));e.target.reset();render()};window.delHospital=id=>{if(confirm('Excluir hospital?')){data.hospitals=data.hospitals.filter(h=>h.id!==id);log('Hospital excluído',id);render()}};window.addMaterial=e=>{e.preventDefault();let f=new FormData(e.target);data.materials.unshift({material:f.get('material'),hospital:f.get('hospital'),obs:f.get('obs'),at:now(),driver});log('Material registrado',f.get('material')+' · '+f.get('hospital'));e.target.reset();render()};
window.downloadTxt=()=>{let text=data.history.map(x=>`${x.at} | ${x.driver} | ${x.action} | ${x.detail}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='sosrim-historico.txt';a.click()};window.backup=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='sosrim-backup.json';a.click()};
const saved=localStorage.sosrim;if(saved)try{data={...data,...JSON.parse(saved)}}catch(e){}render();
setInterval(()=>{if(driver&&tab===1)render()},30000);
connectFirebase();
</script></body></html>
